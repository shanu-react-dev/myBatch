<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Basic Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- Filled Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
      rel="stylesheet"
    />
    <!-- Brand Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./card.css" />
  </head>
  <body>
    <div class="card">
      <div class="imgBox">
        <img
          src="https://images.mubicdn.net/images/cast_member/411801/cache-244672-1502088022/image-w856.jpg"
          alt=""
          height="100px"
        />

        <div>
          <i class="bx bx-bookmark" style="color: #f5f2f2"></i>
        </div>
      </div>
      <div class="details">
        <h3>
          Samantha
          <i class="bxf bx-badge-check" style="color: #1f11dc"></i>
        </h3>

        <p>
          I'm a brand designer who focuses on clarity and emotional connections.
        </p>

        <div class="stats">
          <div>
            <span><i class="bxf bx-star" style="color: #dba012"></i> 4.8</span>
            <span>Ratings</span>
          </div>

          <div class="line"></div>

          <div>
            <span>$45k+</span>
            <span>Earned</span>
          </div>

          <div class="line"></div>

          <div>
            <span>$50/hr</span>
            <span>rate</span>
          </div>
        </div>

        <button>
          <i class="bx bx-envelope" style="color: #ffffff"></i>Get In Touch
        </button>
      </div>
    </div>
  </body>
</html>
