<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        color: #ef0808;
      }

      body {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      form {
        height: 60vh;
        width: 40vw;
        background: #2c2c2c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
      }
      form p {
        text-align: left;
        width: 90%;
        color: #fff;
      }
      form > .inputBox {
        width: 90%;
        height: 30px;
        position: relative;
        /* background-color: lightblue; */
      }
      .inputBox input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: 2px solid #000000;
        padding: 15px 10px 10px 10px;
        outline: none;
        border-radius: 7px;
        color: #fff;
      }

      .inputBox label {
        position: absolute;
        top: 50%;
        left: 10px;
        font-size: 10px;
        color: gainsboro;
        transition: all 1s;
        transform: translateY(-50%);
      }

      .inputBox input:focus + label,
      .inputBox input:valid + label {
        top: 0;
        transform: translateY(30%);
        font-size: 7px;
      }

      form [type="button"],
      form button {
        width: 90%;
        padding: 7px;
        background: #000;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        border-radius: 10px;
        border: 2px solid #000;
        cursor: pointer;
        font-weight: 700;
        position: relative;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      button::before {
        content: "";
        height: 100%;
        width: 0%;
        background-color: rgb(252, 252, 252);
        display: inline-block;
        position: absolute;
        top: 0;
        left: 0;
        transition: width 1s;
        z-index: -1;
      }
      button:hover::before {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <form action="">
      <p>Log in to Instagram</p>
      <div class="inputBox">
        <input type="text" required />
        <label for="">Mobile number, username or email address</label>
      </div>
      <div class="inputBox">
        <input type="password" required />
        <label for="">Password</label>
      </div>

      <!-- <input type="submit" value="Log In" /> -->
      <button>
        <span>Submit</span>
      </button>

      <input type="button" value="Forgotten Password?" />
    </form>

    <!-- <input type="submit" value="Shanu" /> -->
  </body>
</html>
