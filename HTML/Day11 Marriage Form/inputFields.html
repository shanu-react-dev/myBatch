<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Left Input Fields</h1>

    <form>
      <label for="percent">Select Percentage:</label>
      <input type="range" value="0" step="10" />
      <br /><br />
      <label for="partyTime">Party Time Schedule</label>
      <input type="datetime-local" name="partyTime" id="partyTime" />

      <br /><br />
      <label for="week">Select Week</label>
      <input type="week" name="week" id="week" />

      <br /><br />
      <label for="color">Select your Favourite Color</label>
      <input type="color" name="" id="color" />

      <br /><br />
      <label for="">Select Tech Skills</label>
      <input type="checkbox" name="" id="data" />
      <label for="data">Data</label>
      <input type="checkbox" name="" id="library" />
      <label for="library">library</label>
      <input type="checkbox" name="" id="collection" />
      <label for="collection">collection</label>
      <input type="checkbox" name="" id="framework" />
      <label for="framework">framework</label>
      <input type="checkbox" name="" id="packages" checked />
      <label for="packages">packages</label>

      <br /><br />
      <label for="aadhaar">Aadhaar Number</label>
      <input
        type="text"
        name="aadhaar Card"
        id="aadhaar"
        value="2428 4236 9426"
        readonly
      />

      <br /><br />
      <!-- By default for this button type will be submit -->
      <button type="submit">Submit</button>
      <input type="reset" value="reset form" />
      <input type="button" value="Normal Button" />
      <input type="submit" value="Submit Button" />
    </form>

    <button>Shanu</button>
  </body>
</html>
