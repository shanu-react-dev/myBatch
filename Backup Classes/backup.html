<!-- Declaration of HTML Here we are defining HTML 5th versions -->
<!doctype html>
<!-- html tag is known as root element of a webpage -->
<html lang="en">
  <!-- Head tag contains meta data or browser understanding data -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <!-- inside body tag whatever the data we have that is known as user perspective data or here we write visual data. -->
  <body>
    <h1>Hello this is the first class of HTML</h1>
    <h2>This is the second heading</h2>
    <h3>This is the third heading</h3>
    <h4>This is the fourth heading</h4>
    <h5>This is the 5th heading</h5>
    <h6>This is the 6th heading</h6>
    <!-- <h7>Hello</h7>

    <h7>Hii</h7> -->
  </body>
</html>
